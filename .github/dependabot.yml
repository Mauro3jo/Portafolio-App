version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      react-native-dependencies:
        patterns:
          - react
          - react-native
          - "@react-native/*"
      navigation-dependencies:
        patterns:
          - "@react-navigation/*"
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
